name: Publish player downloads

on:
  pull_request:
    branches: [main]
    paths:
      - release-request.json
      - .github/workflows/publish.yml
  push:
    branches: [main]
    paths: [release-request.json]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: strata-player-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production-release
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Read and validate release request
        id: request
        shell: bash
        run: |
          VERSION="$(jq -r '.version' release-request.json)"
          TAG="$(jq -r '.tag' release-request.json)"
          SOURCE_SHA="$(jq -r '.sourceSha' release-request.json)"

          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$TAG" == "v$VERSION" ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Download the three player installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.request.outputs.tag }}
          RELEASE_VERSION: ${{ steps.request.outputs.version }}
        run: |
          mkdir release
          gh release download "$RELEASE_TAG" \
            --repo Cx188/strata-updates \
            --dir release \
            --pattern "Strata-Windows-Setup-$RELEASE_VERSION.exe" \
            --pattern "Strata-macOS-Universal-$RELEASE_VERSION.dmg" \
            --pattern "Strata-Linux-x86_64-$RELEASE_VERSION.AppImage"

          test "$(find release -maxdepth 1 -type f | wc -l)" -eq 3

          gh release download "$RELEASE_TAG" \
            --repo Cx188/strata-updates \
            --dir checksums \
            --pattern SHA256SUMS
          grep -E "Strata-(Windows-Setup|macOS-Universal|Linux-x86_64)-$RELEASE_VERSION\.(exe|dmg|AppImage)$" \
            checksums/SHA256SUMS > release/SHA256SUMS.verify
          test "$(wc -l < release/SHA256SUMS.verify)" -eq 3
          (cd release && sha256sum --check SHA256SUMS.verify)
          rm release/SHA256SUMS.verify

      - name: Attest player installers
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release/*

      - name: Publish clean player-facing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: Cx188/strata
          RELEASE_TAG: ${{ steps.request.outputs.tag }}
          RELEASE_VERSION: ${{ steps.request.outputs.version }}
        run: |
          NEWS_JSON="$(curl --fail --silent --show-error \
            --retry 3 --retry-all-errors --connect-timeout 5 --max-time 20 \
            --user-agent 'Strata-Release/1.0 (+https://stratamc.net)' \
            https://api.stratamc.net/v1/news || printf '[]')"
          NEWS_BODY="$(jq -r '
            if length == 0 then
              "### Strata update\n\nThis release includes launcher improvements and fixes."
            else
              map("### " + .title + "\n\n" + .body) | join("\n\n")
            end
          ' <<<"$NEWS_JSON")"
          cat > release-notes.md <<EOF
          ## What's new

          $NEWS_BODY
          EOF

          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --draft \
              --target "$GITHUB_SHA" \
              --title "Strata $RELEASE_VERSION" \
              --notes-file release-notes.md
          elif [[ "$(gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" --jq .draft)" != "true" ]]; then
            echo "Release $RELEASE_TAG is already published and immutable."
            exit 0
          fi

          for asset in release/*; do
            gh release upload "$RELEASE_TAG" "$asset" --clobber
          done
          gh release edit "$RELEASE_TAG" --draft=false --latest
