name: Publish player downloads

on:
  push:
    branches: [main]
    paths: [release-request.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: strata-player-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read and validate release request
        id: request
        shell: bash
        run: |
          VERSION="$(jq -r '.version' release-request.json)"
          TAG="$(jq -r '.tag' release-request.json)"
          SOURCE_SHA="$(jq -r '.sourceSha' release-request.json)"

          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$TAG" == "v$VERSION" ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Download the three player installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.request.outputs.tag }}
          RELEASE_VERSION: ${{ steps.request.outputs.version }}
        run: |
          mkdir release
          gh release download "$RELEASE_TAG" \
            --repo Cx188/strata-updates \
            --dir release \
            --pattern "Strata-Windows-Setup-$RELEASE_VERSION.exe" \
            --pattern "Strata-macOS-Universal-$RELEASE_VERSION.dmg" \
            --pattern "Strata-Linux-x86_64-$RELEASE_VERSION.AppImage"

          test "$(find release -maxdepth 1 -type f | wc -l)" -eq 3

      - name: Publish clean player-facing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: Cx188/strata
          RELEASE_TAG: ${{ steps.request.outputs.tag }}
          RELEASE_VERSION: ${{ steps.request.outputs.version }}
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
        run: |
          cat > release-notes.md <<EOF
          ## Choose your download

          | Platform | Download |
          | --- | --- |
          | Windows | \`Strata-Windows-Setup-$RELEASE_VERSION.exe\` |
          | macOS | \`Strata-macOS-Universal-$RELEASE_VERSION.dmg\` |
          | Linux x86_64 | \`Strata-Linux-x86_64-$RELEASE_VERSION.AppImage\` |

          Automatic-update support files are kept in a separate technical feed.
          Source revision: \`$SOURCE_SHA\`.
          EOF

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber
            gh release edit "$RELEASE_TAG" \
              --title "Strata $RELEASE_VERSION" \
              --notes-file release-notes.md \
              --latest
          else
            gh release create "$RELEASE_TAG" release/* \
              --target "$GITHUB_SHA" \
              --title "Strata $RELEASE_VERSION" \
              --notes-file release-notes.md \
              --latest
          fi
