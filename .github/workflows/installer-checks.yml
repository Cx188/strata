name: Check command installers

on:
  pull_request:
    paths:
      - install.sh
      - install.ps1
      - Uninstall-Strata-V1.ps1
      - COPY-PASTE-UNINSTALL.txt
      - tests/**
      - .github/workflows/installer-checks.yml
  push:
    branches: [main]
    paths:
      - install.sh
      - install.ps1
      - Uninstall-Strata-V1.ps1
      - COPY-PASTE-UNINSTALL.txt
      - tests/**
      - .github/workflows/installer-checks.yml

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check shell syntax
        run: sh -n install.sh tests/install-linux.test.sh
      - name: Exercise Linux installer paths and asset selection
        run: sh tests/install-linux.test.sh

  windows:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check PowerShell syntax
        shell: pwsh
        run: |
          foreach ($script in @('./install.ps1', './Uninstall-Strata-V1.ps1', './tests/uninstall-windows.test.ps1')) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script),
              [ref]$null,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
            }
          }
      - name: Test V1 cleanup without removing real applications or data
        shell: pwsh
        run: ./tests/uninstall-windows.test.ps1
